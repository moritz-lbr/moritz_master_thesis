[project]
name = "moritz-master-thesis"
version = "1.0.0"
description = "Code for the Master's thesis 'Universal Feature Learning Dynamics Revealed by Self-Averaging Observables' (M. Rautenberg, LMU Munich, 2026)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Moritz Rautenberg", email = "moritz.lb.rautenberg@gmail.com" }]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.11.13"
hydra-core = ">=1.3.2"
tqdm = ">=4.66.4"
numpy = ">=1.26.4"
scipy = ">=1.13"
matplotlib = ">=3.10.7"
pyyaml = ">=6.0"
pillow = ">=10.0"
nvidia-ml-py = ">=13.580.82,<14"
zarr = ">=3.1.5,<4"
numcodecs = ">=0.15"

# JAX / Flax / Optax are installed from PyPI in the flavour of the selected environment.
[tool.pixi.feature.cpu.pypi-dependencies]
jax   = { version = ">=0.5.3,<0.6", extras = ["cpu"] }
flax  = ">=0.10.5,<0.11"
optax = ">=0.2.6,<0.3"

[tool.pixi.feature.gpu.pypi-dependencies]
jax   = { version = ">=0.5.3,<0.6", extras = ["cuda12"] }
flax  = ">=0.10.5,<0.11"
optax = ">=0.2.6,<0.3"

[tool.pixi.feature.gpu13.pypi-dependencies]
jax   = { version = ">=0.6", extras = ["cuda13"] }
flax  = ">=0.10.5,<0.11"
optax = ">=0.2.6,<0.3"

[tool.pixi.feature.gpu]
system-requirements = { cuda = "12" }

[tool.pixi.feature.gpu13]
system-requirements = { cuda = "13" }

[tool.pixi.environments]
default = { features = ["cpu"] }    # CPU only (laptops, quickstart)
gpu = { features = ["gpu"] }        # NVIDIA GPU with CUDA 12 (used for the thesis runs)
gpu13 = { features = ["gpu13"] }    # NVIDIA GPU with CUDA 13

[tool.pixi.tasks]
# pixi run download-data [cifar10] [svhn]
download-data = "python datasets/download.py"
# pixi run train --path <experiment-dir or config.yaml> [--output_dir <dir>]
train = "python src/run_experiment.py"
# pixi run metrics --log-dir <job-dir> [<job-dir> ...]
metrics = "python training_analysis/compute_metrics.py"
# pixi run figures --mup <job-dirs> --sp <job-dirs> --out <dir> [--thesis]
figures = "bash scripts/make_figures.sh"
# schematic figures of the thesis (Figs. 3.2, 4.1, 5.4-5.6)
explanation-figures = "python explanation_figures/mlp_figures.py && python explanation_figures/hidden_representation.py && python explanation_figures/overlap_hidden_representation.py && python explanation_figures/superposition.py"
# download CIFAR-10 + SVHN, train the quickstart experiments and create all figures
quickstart = "bash scripts/quickstart.sh"
